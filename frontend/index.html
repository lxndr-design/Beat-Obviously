<!doctype html>
<html lang="en" style="background: #000000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beat</title>
  </head>
  <body style="background: #000000;">
    <div
      id="beat-boot-splash"
      role="status"
      aria-label="Starting Beat."
      style="
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      "
    >
      <div
        style="
          display: grid;
          grid-template-columns: 32px minmax(0, 1fr);
          grid-template-areas: 'mark copy' 'bar bar';
          align-items: center;
          gap: 10px 12px;
          width: min(320px, calc(100vw - 32px));
          padding: 8px;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.72);
          background: #000000;
        "
      >
        <div
          aria-hidden="true"
          style="
            grid-area: mark;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.72);
            background: rgba(255, 255, 255, 0.1);
            font-size: 18px;
            line-height: 1;
          "
        >B</div>
        <div style="grid-area: copy; min-width: 0;">
          <h1 style="margin: 0; font-size: 18px; line-height: 1; font-weight: 700;">Beat</h1>
          <p style="margin: 4px 0 0; font-size: 11px; line-height: 1; opacity: 0.68;">Starting workspace</p>
        </div>
        <div
          aria-hidden="true"
          style="
            grid-area: bar;
            height: 2px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.18);
          "
        >
          <div
            style="
              width: 38%;
              height: 100%;
              background: #ffffff;
              animation: beat-boot-splash-slide 900ms ease-in-out infinite alternate;
            "
          ></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes beat-boot-splash-slide {
        from { transform: translateX(-75%); }
        to { transform: translateX(185%); }
      }
    </style>
    <div id="root" style="background: #000000;"></div>
    <script type="module" src="/src/main.solid.tsx"></script>
  </body>
</html>
